name: FreshCheckout CI

on:
  push:
    branches: [main, feat/freshcheckout]
    paths:
      - ".github/workflows/freshcheckout-ci.yml"
      - "apps/freshcheckout/**"
      - "freshcheckout.config.json"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/freshcheckout-ci.yml"
      - "apps/freshcheckout/**"
      - "freshcheckout.config.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshcheckout-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/freshcheckout

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: apps/freshcheckout/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and contract tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance tests
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freshcheckout-playwright-diagnostics
          path: |
            apps/freshcheckout/playwright-report
            apps/freshcheckout/test-results
          if-no-files-found: ignore
          retention-days: 7
