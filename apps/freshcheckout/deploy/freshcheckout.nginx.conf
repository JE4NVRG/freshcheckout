limit_req_zone $binary_remote_addr zone=freshcheckout_demo:10m rate=10r/m;

upstream freshcheckout_app {
    server 127.0.0.1:3050 fail_timeout=5s max_fails=3;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name freshcheckout.je4ndev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location = /api/runs {
        limit_req zone=freshcheckout_demo burst=5 nodelay;
        proxy_pass http://freshcheckout_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://freshcheckout_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
